{% extends "base.html" %}
{% block title %}Faulkner{% endblock %}

{% block extra_head %}
<script src="{{ url_for('static', filename='Scripts/faulkner.js') }}"></script>
{% endblock %}

{% block content %}
<div class="page-header">
    <h3 class="top_margin display-4">Faulkner Dictionary</h3>
</div>

<select class="js-example-basic-single chp" onchange="updatePageValues()">
    <option></option>
</select>

<select class="js-example-basic-single pg">
    <option></option>
</select>

<span class="input-group-btn">
    <button class="btn btn-outline-dark" type="button" value="Submit" onclick="updatePageEntries()">
        <i class="fas fa-search"></i>
        Search
    </button>
</span>

<table class="table table-hover" style="display:none; margin-top: 2em;" id="hiddenTable">
    <thead style="width: 100%">
        <tr>
            <th>Hieroglyphs</th>
            <th>Transliteration</th>
            <th>Gardiner Signs</th>
            <th>Translations</th>
        </tr>
    </thead>
    <tbody id="resultBody"><div id="loadScreen" style="display:none" class="loading">Loading&#8230;</div></tbody>
</table>
<p><a href="{{ url_for('index') }}">Back to Search</a></p>
{% endblock %}
