<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Search{% endblock %} - Seba-Seba Egyptian Dictionary</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='Content/favicon.png') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='Content/component-custom-switch.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='Content/Site.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='Content/res.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='Content/css/select2.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='Content/loading.css') }}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.1.0/css/all.css"
          integrity="sha384-lKuwvrZot6UHsBSfcMvOkWwlCMgc0TaWr+30HWe3a4ltaBwTZhyTEggF5tJv8tbt"
          crossorigin="anonymous">
    <script src="{{ url_for('static', filename='Scripts/res/res_aux.js') }}"></script>
    <script src="{{ url_for('static', filename='Scripts/res/res_points.js') }}"></script>
    <script src="{{ url_for('static', filename='Scripts/res/res_lite.js') }}"></script>
    <script src="{{ url_for('static', filename='Scripts/res/res_signinfo.js') }}"></script>
    <script src="{{ url_for('static', filename='Scripts/res/res_struct.js') }}"></script>
    <script src="{{ url_for('static', filename='Scripts/res/res_syntax.js') }}"></script>
    <script src="{{ url_for('static', filename='Scripts/res/res_format.js') }}"></script>
    <script src="{{ url_for('static', filename='Scripts/res/res_render.js') }}"></script>
    <script src="{{ url_for('static', filename='Scripts/res/res_web.js') }}"></script>
    <script src="{{ url_for('static', filename='Scripts/jquery-3.4.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='Scripts/jquery.validate.min.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmQVWYECsXTL1F2Q51N3SIqLAct8"
            crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='Scripts/select2.js') }}"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}max_width{% endblock %}">
    <div id="outsidescreen">
        <span class="outsidescreen_elem hi">&#57344;</span>
        <span class="outsidescreen_elem hiaux">&#35;</span>
        <span class="outsidescreen_elem hinotes">&#35;</span>
    </div>
    <nav class="navbar navbar-dark navbar-expand-sm fixed-top" style="background-color:steelblue;">
        <div class="container">
            <a href="{{ url_for('index') }}" class="nav-home-btn" aria-label="Home">&#x13080;</a>
            <span class="navbar-brand ms-2">Seba-Seba Egyptian Dictionary</span>
            <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav">
                    <li class="nav-item"><a href="{{ url_for('index') }}" class="nav-link">Search</a></li>
                    <li class="nav-item"><a href="{{ url_for('gardiner_signs') }}" class="nav-link">Sign List</a></li>
                    <li class="nav-item"><a href="{{ url_for('sources') }}" class="nav-link">Sources</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="body-content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
